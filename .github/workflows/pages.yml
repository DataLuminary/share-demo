# Deploy share-demo to GitHub Pages (share.dataluminary.dev)
#
# Repo: https://github.com/DataLuminary/share-demo
# DNS: CNAME share.dataluminary.dev -> <org-or-user>.github.io
# Settings -> Pages -> Custom domain + Enforce HTTPS
#
# Configure repository Variables / Secrets for PUBLIC_SHARE_* defaults.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Public embed demo always targets the Demo deployment, not the product app.
          # Share uid/token are the seeded gallery constants in src/config/demoConfig.ts.
          PUBLIC_APP_ORIGIN: https://demo.dataluminary.dev

      - name: Ensure CNAME
        run: echo 'share.dataluminary.dev' > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
