# Deploy share-demo to GitHub Pages (share.dataluminary.dev)
#
# Repo: https://github.com/DataLuminary/share-demo
# DNS: CNAME share.dataluminary.dev -> <org-or-user>.github.io
# Settings -> Pages -> Custom domain + Enforce HTTPS
#
# Configure repository Variables / Secrets for PUBLIC_SHARE_* defaults.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          PUBLIC_SHARE_UID: ${{ secrets.PUBLIC_SHARE_UID }}
          PUBLIC_SHARE_TOKEN: ${{ secrets.PUBLIC_SHARE_TOKEN }}
          PUBLIC_PROXY: ${{ vars.PUBLIC_PROXY }}
          PUBLIC_SDK_CDN_URL: ${{ vars.PUBLIC_SDK_CDN_URL }}

      - name: Ensure CNAME
        run: echo 'share.dataluminary.dev' > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
